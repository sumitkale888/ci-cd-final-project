name: CI Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Lint with Flake8
        run: flake8 service tests app.py

      - name: Lint with Pylint
        run: pylint service app.py tests

      - name: Run unit tests with nosetests
        run: nosetests --with-coverage --cover-package=service -v
