[nosetests]
verbosity=2
with-coverage=1
cover-package=service
cover-inclusive=1
cover-tests=1
cover-min-percentage=80

[coverage:report]
show_missing=True
skip_covered=True

[flake8]
max-line-length=100
exclude=.git,__pycache__,venv,.venv
ignore=E203,W503

[pylint]
disable=C0114,C0115,C0116,R0903,R0902,W0212
max-line-length=100
